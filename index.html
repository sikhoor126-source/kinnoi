<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16131F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="กินพอดี">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%232F8A52%22/%3E%3Cpath d=%22M18 50h64a32 32 0 0 1-64 0z%22 fill=%22white%22/%3E%3C/svg%3E">
<title>กินพอดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one phone column of soft "sticker" cards, mascot hero on Today, floating pill tab bar; modes swap tokens only */
:root{
  --font-display:"Mali","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#F7F4FB; --surface:#FFFFFF; --surface-2:#F0ECF7; --line:#E6E0F0;
  --fg:#2B2440; --muted:#675F7E;
  --acc-l:#2F8A52; --acc-d:#86DCA4; --accent:var(--acc-l); --on-accent:#FFFFFF;
  --ex:#D9622A; --water:#2E8FCB;
  --warn:#8A5A00; --warn-bg:#FFF1C7; --bad:#C0352B; --bad-bg:#FFE3DF;
  --mp:#2F7FC8; --mc:#C88A0F; --mf:#9A55C8;
  --pink:#FF8FB1; --sun:#FFC83D; --sky:#6CC3FF; --mint:#5FD69A; --cheek:#FF9DB5;
  --shadow:0 2px 0 rgb(43 36 64/.05),0 10px 30px rgb(80 60 140/.08);
  color-scheme:light;
}
:root[data-accent="peach"]{--acc-l:#C9502E;--acc-d:#FFA889}
:root[data-accent="soda"]{--acc-l:#2C74C0;--acc-d:#93C9FF}
:root[data-accent="anchan"]{--acc-l:#6A48C9;--acc-d:#BFA8FF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131F; --surface:#211C2E; --surface-2:#2C263B; --line:#3A3350;
    --fg:#F2EDFB; --muted:#ABA3C2; --accent:var(--acc-d); --on-accent:#1A1625;
    --ex:#FF9A66; --water:#7CC6F5; --warn:#FFD36B; --warn-bg:#3B2F12; --bad:#FF8D80; --bad-bg:#3E1D1A;
    --mp:#8DBFF0; --mc:#F2C35C; --mf:#D2A4F2; --cheek:#E0789A;
    --shadow:0 2px 0 rgb(0 0 0/.2); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131F; --surface:#211C2E; --surface-2:#2C263B; --line:#3A3350;
  --fg:#F2EDFB; --muted:#ABA3C2; --accent:var(--acc-d); --on-accent:#1A1625;
  --ex:#FF9A66; --water:#7CC6F5; --warn:#FFD36B; --warn-bg:#3B2F12; --bad:#FF8D80; --bad-bg:#3E1D1A;
  --mp:#8DBFF0; --mc:#F2C35C; --mf:#D2A4F2; --cheek:#E0789A;
  --shadow:0 2px 0 rgb(0 0 0/.2); color-scheme:dark;
}
:root[data-size="big"]{font-size:118%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--accent) 14%,transparent) 1px,transparent 0);background-size:22px 22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active:not(:disabled){transform:scale(.95)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.app{max-width:30rem;margin:0 auto;padding-inline:16px;padding-block:14px calc(7.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.app.enter>*{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:.01em}
.brand-mark{width:40px;height:40px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 45%,#000)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.12rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pill-note{font-size:.78rem;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill-note i{width:8px;height:8px;border-radius:4px;background:var(--muted)}
.pill-note.on i{background:var(--mint)}
.pill-note.off i{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.datenav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.iconbtn{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);box-shadow:var(--shadow)}
.iconbtn:disabled{opacity:.35;cursor:default}
.datelabel{text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.08rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;min-height:46px;box-shadow:var(--shadow)}
.hero-card{position:relative;overflow:hidden;background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--sun) 30%,transparent);pointer-events:none}
.mascot-row{display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1}
.mascot{width:86px;height:86px;flex-shrink:0;animation:bob 3s ease-in-out infinite}
.mascot.bounce{animation:hop .6s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.05,.95)}60%{transform:translateY(0) scale(.95,1.05)}100%{transform:none}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--fg);border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:.92rem;line-height:1.45;min-width:0;flex:1;margin-bottom:22px}
.bubble b{font-family:var(--font-display)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:8.25rem;height:8.25rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:color-mix(in srgb,var(--accent) 18%,var(--surface));stroke-width:14}
.ring-val{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.3,1.4,.5,1)}
.ring-val.over{stroke:var(--bad)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .big{font-size:2.05rem;font-weight:700;line-height:1.05}
.stats{display:flex;flex-direction:column;gap:8px;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:6px 12px}
.stat b{font-family:var(--font-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:color-mix(in srgb,var(--sun) 35%,var(--surface));font-family:var(--font-display);font-weight:600;font-size:.9rem}
.streak svg{color:var(--ex)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.3,1.4,.5,1);background-image:linear-gradient(90deg,transparent 0 60%,rgb(255 255 255/.25) 60% 80%,transparent 80%)!important;background-blend-mode:normal}
.sodium{border-radius:16px;padding:10px 12px;margin-inline:-4px}
.sodium.warn{background:var(--warn-bg);color:var(--warn)}
.sodium.bad{background:var(--bad-bg);color:var(--bad)}
.meal{display:flex;flex-direction:column}
.meal+.meal{border-top:2px dotted var(--line);padding-top:10px;margin-top:2px}
.meal-head{display:flex;justify-content:space-between;align-items:center;min-height:42px;gap:8px}
.meal-head h3{font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:8px}
.meal-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.addlink{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:0;color:var(--accent);font-weight:600;min-height:40px;padding:0 14px;border-radius:999px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 6px;min-height:52px;border-radius:14px}
.item:hover{background:var(--surface-2)}
.item .name{font-weight:500}
.item .sub{font-size:.82rem;color:var(--muted)}
.item .kcal{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface-2);padding:2px 10px;border-radius:999px}
.empty{color:var(--muted);font-size:.9rem;padding:2px 0 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--surface-2);padding:5px;border-radius:999px}
.seg button{min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chip{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;min-height:54px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:0 18px;color:var(--muted);box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1rem;color:var(--fg)}
.btn{min-height:52px;border-radius:999px;border:0;font-weight:600;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:1.02rem}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-ex{background:var(--ex);color:#FFFFFF;box-shadow:0 4px 0 color-mix(in srgb,var(--ex) 50%,#000)}
.btn-danger{background:transparent;color:var(--bad);border:2px solid currentColor}
.btn-block{width:100%}
.btn-dash{width:100%;background:transparent;border:2px dashed var(--accent);color:var(--accent)}
.list{display:flex;flex-direction:column}
.list .item{border-bottom:2px dotted var(--line);border-radius:0;padding:10px 4px}
.list .item:last-child{border-bottom:0}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:1px}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:29rem;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgb(40 30 80/.18)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{min-height:56px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.68rem;border-radius:999px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tab[aria-current="page"] svg{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
.tab svg{width:22px;height:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.mini .val{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.cup{height:44px;border:2px solid var(--water);border-top-width:0;border-radius:4px 4px 12px 12px;background:transparent;position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water);opacity:.75;transition:height .35s cubic-bezier(.3,1.4,.5,1)}
.cup.full::after{height:78%}
.stepper{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:10px}
.stepper button{width:54px;height:54px;border-radius:27px;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;line-height:1;box-shadow:var(--shadow)}
.stepper input{width:100%;text-align:center;font-family:var(--font-display);font-size:2.2rem;font-weight:700;border:0;background:transparent;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600}
.field input,.field select{min-height:50px;border:2px solid var(--line);border-radius:16px;padding:0 14px;background:var(--surface);font-size:1rem;font-weight:400;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:0}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{min-height:80px;border:2px solid var(--line);border-radius:20px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.85rem;padding:6px}
.act[aria-pressed="true"]{border-color:var(--ex);background:color-mix(in srgb,var(--ex) 14%,var(--surface));font-weight:600}
.act[aria-pressed="true"] svg{animation:hop .6s ease-out}
.act svg{width:26px;height:26px}
.exrow{display:flex;align-items:center;gap:12px}
.exdot{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--ex) 18%,var(--surface));color:var(--ex);display:grid;place-items:center;flex-shrink:0}
.callout{border-radius:22px;padding:16px;background:color-mix(in srgb,var(--sun) 28%,var(--surface));border:2px dashed color-mix(in srgb,var(--sun) 80%,var(--fg));display:flex;flex-direction:column;gap:8px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:52px;height:52px;border-radius:18px;border:3px solid transparent;display:grid;place-items:center;color:#fff;transform:rotate(-4deg)}
.swatch:nth-child(even){transform:rotate(4deg)}
.swatch[aria-pressed="true"]{border-color:var(--fg);transform:rotate(0) scale(1.08)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px;position:relative}
.kbars .b{border-radius:12px 12px 6px 6px;background:var(--accent);min-height:4px;transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.kbars .b.over{background:var(--mc)}
.kbars .b.today{opacity:.55}
.kbars .target{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6}
.klabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-size:.75rem;color:var(--muted)}
.backdrop{position:fixed;inset:0;background:rgb(20 12 40/.45);z-index:40;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:30rem;background:var(--surface);border-radius:30px 30px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:44px;height:6px;border-radius:3px;background:var(--line);align-self:center}
.nut{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.nut div{background:var(--surface-2);border-radius:16px;padding:8px 2px;display:flex;flex-direction:column}
.nut b{font-family:var(--font-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.nut span{font-size:.7rem;color:var(--muted)}
.nut .hi{background:var(--warn-bg);color:var(--warn)}
.nut .hi span{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 10px 24px rgb(0 0 0/.22);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.8)}to{transform:translateX(-50%) scale(1)}}
.status{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.status i{width:10px;height:10px;border-radius:5px;background:var(--muted);flex-shrink:0;margin-top:6px}
.status.on i{background:var(--mint)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall 1.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app" aria-live="polite"></div>
<nav class="tabbar" aria-label="เมนูหลัก"><div class="tabbar-in" id="tabbar"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
// ===== ตั้งค่า: ใส่ลิงก์ Web app ของ Apps Script (ลงท้ายด้วย /exec) =====
var CONFIG={
  SCRIPT_URL:"PASTE_YOUR_WEB_APP_URL_HERE",
  GOOGLE_CLIENT_ID:""   // ใส่ค่าเดียวกับใน Code.gs ถ้าใช้ปุ่ม Google
};

// ---------- constants ----------
var MEALS=[["b","เช้า"],["l","กลางวัน"],["d","เย็น"],["s","ของว่าง"]];
var MEALNAME={b:"มื้อเช้า",l:"มื้อกลางวัน",d:"มื้อเย็น",s:"ของว่าง"};
var ACTS=[
 {id:"walk",name:"เดิน",met:[2.8,3.5,4.3],ic:'<circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 12l2-4 4 1 2 3 3 1"/>'},

function flush(){
  if(flushing||!SESSION||!configured())return;
  var ks=Object.keys(dirty);
  if(!ks.length&&!profDirty){setSync("ok");return;}
  flushing=true;setSync("saving");
  var chain=Promise.resolve();
  if(profDirty)chain=chain.then(function(){profDirty=false;return api("saveProfile",{data:{profile:S.profile,settings:S.settings}}).catch(function(e){profDirty=true;throw e;});});
  ks.forEach(function(k){chain=chain.then(function(){delete dirty[k];return api("saveDay",{date:k,day:S.days[k]}).catch(function(e){dirty[k]=true;throw e;});});});
  chain.then(function(){flushing=false;lsSet();if(Object.keys(dirty).length||profDirty)flush();else setSync("ok");})
    .catch(function(e){flushing=false;lsSet();if(e.auth){logout(true);return;}setSync("offline");});
}

    var days=j.days||{};Object.keys(dirty).forEach(function(k){if(S.days[k])days[k]=S.days[k];});
    S.days=days;S.health=j.health||{};loadFoods(j.foods);lsSet();applyModes();

// ---------- nutrition math ----------
function unitGrams(f,unit){if(unit==="กรัม")return 1;for(var i=0;i<f.units.length;i++)if(f.units[i][0]===unit)return f.units[i][1];return f.units[0][1];}
function nut(f,grams){var r=grams/100;return {kcal:f.kcal*r,p:f.p*r,c:f.c*r,f:f.f*r,na:f.na*r};}
function itemNut(it){var f=BYID[it.food];if(!f)return {kcal:0,p:0,c:0,f:0,na:0};return nut(f,unitGrams(f,it.unit)*it.qty);}
function sumDay(k){
  var d=day(k),t={kcal:0,p:0,c:0,f:0,na:0,ex:0};
  d.items.forEach(function(it){var n=itemNut(it);t.kcal+=n.kcal;t.p+=n.p;t.c+=n.c;t.f+=n.f;t.na+=n.na;});
  d.ex.forEach(function(e){t.ex+=e.kcal;});return t;
}
function latest(field,beforeKey){
  var ks=Object.keys(S.days).filter(function(k){return S.days[k][field]!=null&&S.days[k][field]!==""&&(!beforeKey||k<=beforeKey);}).sort();
  return ks.length?{k:ks[ks.length-1],v:+S.days[ks[ks.length-1]][field]}:null;
}
function currentWeight(){var w=latest("weight",S.date);return w?w.v:+S.profile.weight;}
function targets(){
  var p=S.profile,w=currentWeight(),h=+p.height,a=+p.age,method="สูตร Mifflin-St Jeor";
  var bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161);
  // use lean mass when body-fat readings are consistent enough (>= 4 in 30 days)
  var since=addDays(S.date,-30),bfs=Object.keys(S.days).filter(function(k){return k>=since&&k<=S.date&&S.days[k].bf;}).sort();
  if(bfs.length>=4){var avg=bfs.slice(-4).reduce(function(s,k){return s+ +S.days[k].bf;},0)/4;bmr=370+21.6*w*(1-avg/100);method="สูตร Katch-McArdle (จากมวลไร้ไขมัน)";}
  var tdee=bmr*ACTIVITY[+p.activity][1];
  var adj=p.goal==="lose"?(p.speed==="slow"?-300:-500):p.goal==="gain"?(p.speed==="slow"?250:400):0;
  var floor=p.sex==="m"?1500:1200,kcal=Math.round((tdee+adj)/10)*10,floored=false;
  if(kcal<floor){kcal=floor;floored=true;}
  var prot=Math.round(w*(p.goal==="lose"?1.4:1.2));
  var fat=Math.round(kcal*0.3/9),carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {kcal:kcal,p:prot,f:fat,c:carb,na:2000,bmr:Math.round(bmr),tdee:Math.round(tdee),floored:floored,method:method,w:w,baseActive:Math.round((ACTIVITY[+p.activity][1]-1.2)*bmr)};
}
function exKcal(act,min,lvl,w){var a=ACTS.filter(function(x){return x.id===act;})[0];return Math.round(a.met[lvl]*w*min/60);}

  while(has(k)){n++;k=addDays(k,-1);}

}

function weightChart(){
  var keys=Object.keys(S.days).filter(function(k){return S.days[k].weight&&k<=S.date&&k>=addDays(S.date,-29);}).sort();
  if(keys.length<2)return '<div class="empty">บันทึกน้ำหนักอย่างน้อย 2 วันเพื่อดูกราฟ</div>';
  var pts=keys.map(function(k){return {k:k,v:+S.days[k].weight};});
  var avg=pts.map(function(p){var lo=addDays(p.k,-6),xs=pts.filter(function(q){return q.k>=lo&&q.k<=p.k;});return xs.reduce(function(s,q){return s+q.v;},0)/xs.length;});
  var all=pts.map(function(p){return p.v;}).concat(avg),mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  var pad=Math.max(0.3,(mx-mn)*0.15);mn=Math.floor((mn-pad)*10)/10;mx=Math.ceil((mx+pad)*10)/10;
  var W=320,H=150,L=34,R=8,Tp=10,B=22,start=parseKey(addDays(S.date,-29)).getTime(),span=29*864e5;
  function x(k){return L+(parseKey(k).getTime()-start)/span*(W-L-R);}

  var mid=Math.round((mn+mx)/2*10)/10;
  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟน้ำหนัก 30 วัน">';
  [mx,mid,mn].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>';});
  g+='<text x="'+L+'" y="'+(H-6)+'">'+esc(parseKey(addDays(S.date,-29)).toLocaleDateString("th-TH",{day:"numeric",month:"short"}))+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(parseKey(S.date).toLocaleDateString("th-TH",{day:"numeric",month:"short"}))+'</text>';
  pts.forEach(function(p){g+='<circle cx="'+x(p.k).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3" fill="var(--muted)" opacity=".55"/>';});
  g+='<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(function(p,i){return x(p.k).toFixed(1)+","+y(avg[i]).toFixed(1);}).join(" ")+'"/>';

function applyModes(){
  var r=document.documentElement,st=S.settings;
  if(st.theme==="auto"){if(hostTheme)r.setAttribute("data-theme",hostTheme);else r.removeAttribute("data-theme");}else r.setAttribute("data-theme",st.theme);
  r.setAttribute("data-accent",st.accent);
  if(st.size==="big")r.setAttribute("data-size","big");else r.removeAttribute("data-size");
}
function readProfileInputs(){
  function v(id){var el=document.getElementById(id);return el?el.value:null;}
  if(document.getElementById("p_age")){S.profile.age=+v("p_age")||S.profile.age;S.profile.height=+v("p_height")||S.profile.height;S.profile.weight=+v("p_weight")||S.profile.weight;S.profile.activity=+v("p_activity");}
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),v=el.getAttribute("data-v"),d;
  switch(a){
    case "logout":logout(false);break;
    case "copy":var inp=document.getElementById("shurl");
      try{navigator.clipboard.writeText(v).then(function(){toast("คัดลอกแล้ว");},function(){inp.select();toast("เลือกข้อความแล้ว กดคัดลอกเองได้เลย");});}catch(e){inp.select();}break;
    case "tab":readProfileInputs();S.tab=v;S.query="";render();window.scrollTo(0,0);break;
    case "day":S.date=addDays(S.date,+v);if(S.date>TODAY)S.date=TODAY;S.weigh={};render();break;
    case "today":S.date=TODAY;S.weigh={};render();break;
    case "addmeal":S.meal=v;S.tab="food";S.query="";render();window.scrollTo(0,0);break;
    case "meal":S.meal=v;render();break;
    case "filter":S.filter=v;render();break;
    case "pick":openPick(v);break;
    case "edit":var it=day().items.filter(function(x){return x.id===v;})[0];if(it)openPick(it.food,v);break;
    case "close":closeSheet();break;
    case "shmeal":S.sheet.meal=v;renderSheet();break;
    case "unit":var f=BYID[S.sheet.food],oldG=unitGrams(f,S.sheet.unit)*S.sheet.qty;S.sheet.unit=v;
      if(v==="กรัม")S.sheet.qty=Math.round(oldG);else{var q=Math.round(oldG/unitGrams(f,v)*2)/2;S.sheet.qty=q>0?q:1;}renderSheet();break;
    case "qty":var stp=S.sheet.unit==="กรัม"?10:0.5;S.sheet.qty=Math.max(stp,Math.round((S.sheet.qty+ +v*stp)*100)/100);renderSheet();break;
    case "saveitem":
      var sh=S.sheet;if(!(sh.qty>0)){toast("ใส่จำนวนมากกว่า 0");break;}d=day();
      if(sh.edit){var e=d.items.filter(function(x){return x.id===sh.edit;})[0];if(e){e.unit=sh.unit;e.qty=sh.qty;e.meal=sh.meal;}toast("แก้ไขแล้ว");}
      else{d.items.push({id:uid(),meal:sh.meal,food:sh.food,unit:sh.unit,qty:sh.qty});toast("ใส่ "+BYID[sh.food].name+" ลง"+MEALNAME[sh.meal]+"แล้ว ง่ำ ๆ");}
      saveDay(S.date);closeSheet();render();hop();break;
    case "delitem":d=day();d.items=d.items.filter(function(x){return x.id!==S.sheet.edit;});saveDay(S.date);closeSheet();toast("ลบแล้ว");render();break;
    case "combo":var c=COMBOS.filter(function(x){return x.id===v;})[0];d=day();
      c.items.forEach(function(x){d.items.push({id:uid(),meal:S.meal,food:x.food,unit:x.unit,qty:x.qty});});
      saveDay(S.date);toast("เพิ่ม "+c.name+" แล้ว แตะรายการเพื่อปรับจำนวนข้าวได้นะ");render();break;
    case "copyy":d=day();day(addDays(S.date,-1)).items.filter(function(x){return x.meal===S.meal;}).forEach(function(x){d.items.push({id:uid(),meal:x.meal,food:x.food,unit:x.unit,qty:x.qty});});
      saveDay(S.date);toast("คัดลอกจากเมื่อวานแล้ว");S.tab="today";render();break;
    case "water":d=day();d.water=Math.max(0,d.water+ +v);saveDay(S.date);render();break;
    case "wcont":S.settings.wCont=+v;saveProfile();render();break;
    case "wfrac":S.settings.wFrac=+v;saveProfile();render();break;
    case "wadd":d=day();if(!d.drinks){d.drinks=[];if(d.water)d.drinks.push({id:uid(),ml:d.water*250,label:d.water+" แก้ว (เดิม)"});delete d.water;}
      var before=waterMl(d),amt=Math.round(S.settings.wCont*S.settings.wFrac),cn=CONTS.filter(function(c){return c[1]===S.settings.wCont;})[0],fr=FRACS.filter(function(f){return f[0]===S.settings.wFrac;})[0];
      d.drinks.push({id:uid(),ml:amt,label:(fr[0]===1?"":fr[1]+" ")+(cn?cn[0]:"")+" · "+fmtMl(amt)});saveDay(S.date);render();
      if(before<S.settings.waterGoal&&waterMl(d)>=S.settings.waterGoal){confetti();toast("ดื่มน้ำครบเป้าแล้ว ชื่นใจ!");}else toast("เติมน้ำ "+fmtMl(amt)+" แล้ว");break;
    case "wdel":d=day();d.drinks=(d.drinks||[]).filter(function(x){return x.id!==v;});saveDay(S.date);render();break;
    case "wgoal":S.settings.waterGoal=+v;saveProfile();readProfileInputs();render();break;
    case "cup":d=day();var nv=+v;var was=d.water;d.water=(d.water===nv)?nv-1:nv;saveDay(S.date);render();if(was<8&&d.water>=8){confetti();toast("ดื่มน้ำครบ 8 แก้วแล้ว เยี่ยม!");}break;
    case "exact":S.ex.act=v;render();break;
    case "exlvl":S.ex.lvl=+v;render();break;
    case "exset":S.ex.min=+v;render();break;
    case "exmin":S.ex.min=Math.max(5,Math.min(600,S.ex.min+ +v));render();break;
    case "exadd":d=day();d.ex.push({id:uid(),act:S.ex.act,min:S.ex.min,lvl:S.ex.lvl,kcal:exKcal(S.ex.act,S.ex.min,S.ex.lvl,currentWeight())});saveDay(S.date);toast("เก่งมาก! บันทึกการขยับตัวแล้ว");S.tab="today";render();window.scrollTo(0,0);confetti();break;
    case "delex":d=day();d.ex=d.ex.filter(function(x){return x.id!==v;});saveDay(S.date);render();break;
    case "weigh":
      d=day();var vals={weight:"w_weight",bf:"w_bf",mus:"w_mus",vis:"w_vis"},ok=false;
      Object.keys(vals).forEach(function(k){var x=document.getElementById(vals[k]).value;if(x===""){delete d[k];}else{var nmb=parseFloat(x);if(!isNaN(nmb)&&nmb>0){d[k]=nmb;ok=true;}}});
      if(d.weight){S.profile.weight=d.weight;saveProfile();}
      S.weigh={};saveDay(S.date);toast(ok?"บันทึกแล้ว":"ล้างค่าของวันนี้แล้ว");render();break;
    case "theme":S.settings.theme=v;applyModes();saveProfile();readProfileInputs();render();break;
    case "accent":S.settings.accent=v;applyModes();saveProfile();readProfileInputs();render();break;
    case "size":S.settings.size=v;applyModes();saveProfile();readProfileInputs();render();break;
    case "eatback":S.settings.eatBack=+v;saveProfile();readProfileInputs();render();break;
    case "sex":case "goal":case "speed":readProfileInputs();S.profile[a]=v;render();break;
    case "saveprof":readProfileInputs();S.profile.example=false;saveProfile();toast("บันทึกโปรไฟล์แล้ว");render();break;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){S.query=t.value;var pos=t.selectionStart;render();var q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
  else if(t.id==="qty"){var n=parseFloat(t.value);if(!isNaN(n)&&n>=0){S.sheet.qty=n;var keep=t.value;renderSheet();var el=document.getElementById("qty");el.value=keep;el.focus();}}
  else if(t.id==="exmin"){var m=parseInt(t.value,10);if(m>0){S.ex.min=Math.min(600,m);}}
  else if(t.id&&t.id.indexOf("w_")===0){var map={w_weight:"weight",w_bf:"bf",w_mus:"mus",w_vis:"vis"};S.weigh[map[t.id]]=t.value;}
});
document.addEventListener("change",function(ev){if(ev.target.id==="exmin")render();});
document.addEventListener("submit",function(ev){if(ev.target.id==="loginForm"){ev.preventDefault();var u=document.getElementById("l_user").value.trim(),p=document.getElementById("l_pin").value.trim();S.loginUser=u;if(!u||!p){S.loginErr="ใส่ชื่อผู้ใช้และ PIN ให้ครบ";render();return;}doLogin({user:u,pin:p});}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&S.sheet)closeSheet();});

// ---------- boot ----------
if(SESSION){var c0=lsGet();if(c0)restore(c0);}
applyModes();render();
if(SESSION)sync();
window.addEventListener("online",function(){if(SESSION)flush();});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&SESSION&&!flushing&&!Object.keys(dirty).length){TODAY=dkey(new Date());sync();}});
})();
</script>
</body>
</html>
